<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - AgriLink</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #ffffff 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .otp-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .otp-icon {
            font-size: 50px;
            color: #198754;
            margin-bottom: 20px;
        }

        .otp-input {
            letter-spacing: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .otp-input:focus {
            border-color: #198754;
            box-shadow: 0 0 10px rgba(25,135,84,0.2);
            outline: none;
        }

        .btn-verify {
            background: linear-gradient(135deg, #198754, #0f6c3e);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
            color: white;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25,135,84,0.3);
            opacity: 0.9;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .resend-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .resend-link {
            color: #198754;
            text-decoration: none;
            font-weight: 600;
        }

        .resend-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="otp-container">
    <div class="otp-icon">📩</div>
    <h2 class="fw-bold mb-2">Verify OTP</h2>
    <p class="text-muted mb-4">We've sent a 6-digit code to your email. Please enter it below.</p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-danger py-2 small" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text"
                   name="otp"
                   class="form-control otp-input"
                   placeholder="000000"
                   maxlength="6"
                   pattern="\d{6}"
                   required
                   autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn btn-verify">Verify Account</button>
    </form>

    <div class="resend-text">
        Didn't receive the code? <br>
        <a href="#" class="resend-link">Resend OTP</a>
    </div>

    <div class="mt-4">
        <a href="/" class="text-muted small text-decoration-none">← Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
