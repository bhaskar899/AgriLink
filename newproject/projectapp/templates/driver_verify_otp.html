{% extends "master.html" %}
{% block title %}Verify OTP{% endblock %}

{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card mx-auto shadow-lg rounded-4" style="max-width:500px;">
    <div class="card-body">
      <h4 class="card-title text-center mb-4">Verify OTP</h4>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" action="{% url 'verify_driver_otp' %}">
        {% csrf_token %}
        <div class="mb-3">
          <input class="form-control rounded-3" type="text" name="otp" placeholder="Enter OTP" required>
        </div>
        <button type="submit" class="btn btn-success w-100 py-2 rounded-3">Verify OTP</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
