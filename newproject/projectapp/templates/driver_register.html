{% extends "master.html" %}
{% block title %}Driver Register{% endblock %}
{% block body %}

<br><br>
<div class="container mt-5">
  <div class="card mx-auto" style="max-width:600px">
    <div class="card-body">
      <h4 class="card-title text-center">Driver Registration</h4>
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-2"><input class="form-control" name="name" placeholder="Full name" required></div>
        <div class="mb-2"><input class="form-control" name="email" type="email" placeholder="Email" required></div>
        <div class="mb-2"><input class="form-control" name="phone" placeholder="Phone"></div>
        <div class="mb-2"><input class="form-control" name="password" type="password" placeholder="Password" required></div>
        <div class="mb-2"><input class="form-control" name="vehicle_number" placeholder="Vehicle number"></div>
        <div class="mb-2"><input class="form-control" name="capacity" placeholder="Capacity (kg)" value="1000"></div>
        <div class="mb-2"><input class="form-control" name="rate_per_km" placeholder="Rate per km" value="12.0"></div>
        <div class="mb-2"><input class="form-control" name="location" placeholder="City / Pin"></div>
        <button class="btn btn-success w-100">Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
