{% extends "master.html" %}
{% block title %}AgriLink Pro | Driver Registration{% endblock %}

{% block body %}
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root { --driver-green:#198754; --driver-dark:#0f172a; }
    body { display:flex; flex-direction:column; min-height:100vh; margin:0; font-family:'Plus Jakarta Sans',sans-serif; background-color:#f8fafc; }
    .driver-wrapper {
        flex-grow:1; background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);
        display:flex; justify-content:center; align-items:center;
        padding:140px 20px 80px; position:relative;
    }
    .driver-card {
        width:100%; max-width:900px; background:rgba(255,255,255,.95);
        backdrop-filter:blur(10px); border-radius:30px;
        border:1px solid rgba(255,255,255,.3);
        box-shadow:0 25px 50px -12px rgba(0,0,0,.08);
        padding:40px; position:relative; z-index:2;
    }
    .back-btn {
        position:absolute; top:80px; left:40px; text-decoration:none;
        color:var(--driver-dark); font-weight:700; display:flex; align-items:center; gap:8px;
        z-index:1000; padding:12px 20px; background:white; border-radius:50px;
        box-shadow:0 4px 15px rgba(0,0,0,.1); transition:.3s ease; border:1px solid #e2e8f0;
    }
    .back-btn:hover { background:var(--driver-dark); color:white; transform:translateX(-5px); }
    .section-title {
        font-size:.85rem; font-weight:800; color:var(--driver-green); text-transform:uppercase;
        letter-spacing:1px; margin:25px 0 15px; padding-bottom:8px; border-bottom:2px solid #ecfdf5;
        display:flex; align-items:center; gap:10px;
    }
    .form-label { font-weight:700; font-size:.8rem; color:#64748b; margin-bottom:6px; margin-left:4px; }
    .form-control, .form-select {
        border-radius:12px; padding:12px 15px; border:1.5px solid #e2e8f0;
        background-color:#f8fafc; transition:.3s; font-size:.95rem;
    }
    .form-control:focus, .form-select:focus {
        border-color:var(--driver-green); box-shadow:0 0 0 4px rgba(25,135,84,.1);
        background-color:white; outline:none;
    }
    /* Valid / Invalid */
    .form-control.is-valid, .form-select.is-valid { border-color:#22c55e !important; background:#f0fdf4 !important; }
    .form-control.is-invalid, .form-select.is-invalid { border-color:#ef4444 !important; background:#fff5f5 !important; }
    /* Validation messages */
    .val-msg { font-size:.76rem; font-weight:700; margin-top:4px; min-height:18px; display:block; }
    .val-msg.ok   { color:#15803d; }
    .val-msg.err  { color:#ef4444; }
    .val-msg.info { color:#f59e0b; }
    /* Password strength */
    .pass-strength-bar { height:4px; border-radius:4px; margin-top:6px; background:#e5e7eb; overflow:hidden; }
    .pass-strength-fill { height:100%; border-radius:4px; transition:width .35s ease,background .35s ease; width:0%; }
    .btn-verify { background:var(--driver-dark); color:white; border:none; border-radius:12px; font-weight:700; transition:.3s; }
    .btn-verify:hover { background:#1e293b; }
    .registration-btn {
        background:var(--driver-green); color:white; border:none; padding:16px; border-radius:16px;
        font-weight:700; font-size:1.1rem; transition:.3s; box-shadow:0 10px 20px rgba(25,135,84,.2);
    }
    .registration-btn:disabled { background:#94a3b8; box-shadow:none; }
    .invalid-feedback { font-weight:600; font-size:.75rem; }
    footer { margin-top:0 !important; }
    .gps-badge { font-size:.78rem; padding:6px 12px; border-radius:10px; font-weight:700; display:inline-flex; align-items:center; gap:6px; margin-top:8px; }
    .gps-success { background:#d1fae5; color:#065f46; }
    .gps-error   { background:#fee2e2; color:#991b1b; }
    .gps-loading { background:#fef3c7; color:#92400e; }
</style>

<div class="driver-wrapper">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="driver-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Join AgriLink Fleet</h2>
            <p class="text-muted small">Professional driver registration portal</p>
        </div>

        <form id="driverForm" method="POST" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <div class="row">
                <!-- LEFT COLUMN -->
                <div class="col-md-6 border-end pe-md-4">
                    <div class="section-title"><i class="fas fa-user-circle"></i> Personal Details</div>

                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input class="form-control" name="name" id="name" placeholder="Enter your full name" required>
                        <span class="val-msg" id="nameMsg"></span>
                    </div>

                    <!-- Email + OTP — ORIGINAL FLOW UNCHANGED -->
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group gap-2">
                            <input class="form-control" type="email" name="email" id="email" placeholder="email@example.com" required>
                            <button type="button" class="btn btn-verify px-3" id="sendOTPBtn" onclick="sendOTP()">Verify</button>
                        </div>
                        <span class="val-msg" id="emailMsg"></span>
                    </div>

                    <div id="otpBox" class="mb-3" style="display:none;">
                        <label class="form-label text-success">Verification OTP</label>
                        <div class="input-group gap-2">
                            <input class="form-control border-success" id="otp_input" placeholder="Enter 6-digit OTP" maxlength="6" oninput="this.value=this.value.replace(/\D/g,'')">
                            <button type="button" class="btn btn-verify px-3" id="verifyOTPBtn" onclick="verifyOTP()">Confirm</button>
                        </div>
                        <div class="mt-1" id="otpError"></div>
                        <input type="hidden" name="otp_verified" id="otp_verified" value="false">
                    </div>

                    <!-- Phone + Password row -->
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Phone</label>
                            <input class="form-control" name="phone" id="phone" placeholder="10-digit no." maxlength="10" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Password</label>
                            <input class="form-control" type="password" name="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="pass-strength-bar mt-1"><div class="pass-strength-fill" id="strengthFill"></div></div>
                    <span class="val-msg" id="phoneMsg"></span>
                    <span class="val-msg" id="passMsg"></span>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="col-md-6 ps-md-4">
                    <div class="section-title"><i class="fas fa-truck"></i> Vehicle Details</div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Vehicle Type</label>
                            <select class="form-select" name="vehicle_type" id="vehicleType" required>
                                <option value="">Select</option>
                                <option value="bike">Bike</option>
                                <option value="tempo">Tempo</option>
                                <option value="pickup">Pickup</option>
                                <option value="truck">Truck</option>
                            </select>
                            <span class="val-msg" id="vehicleTypeMsg"></span>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Vehicle Number</label>
                            <input class="form-control text-uppercase" name="vehicle_number" id="vehicleNo"
                                   placeholder="MH12AB1234" maxlength="10">
                            <span class="val-msg" id="vehicleNoMsg"></span>
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Capacity (kg)</label>
                            <input class="form-control" type="number" name="capacity" id="capacity" placeholder="e.g. 500" min="1">
                            <span class="val-msg" id="capacityMsg"></span>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Rate (per KM)</label>
                            <input class="form-control" type="number" step="0.1" name="rate_per_km" id="rateInput" placeholder="₹ 15" min="1">
                            <span class="val-msg" id="rateMsg"></span>
                        </div>
                    </div>

                    <div class="section-title"><i class="fas fa-file-shield"></i> Documents</div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label class="form-label">License Photo</label>
                            <input type="file" name="license_image" id="licenseFile" class="form-control" accept="image/*" required>
                            <span class="val-msg" id="licenseMsg"></span>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Vehicle Photo</label>
                            <input type="file" name="vehicle_image" id="vehicleFile" class="form-control" accept="image/*" required>
                            <span class="val-msg" id="vehicleFileMsg"></span>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label">License Expiry</label>
                            <input type="date" name="license_expiry_date" id="licenseExpiry" class="form-control" required>
                            <span class="val-msg" id="licenseExpiryMsg"></span>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Base City</label>
                            <input class="form-control" name="location" id="baseCity" placeholder="e.g. Pune">
                            <span class="val-msg" id="baseCityMsg"></span>
                        </div>
                    </div>

                    <!-- GPS — original unchanged -->
                    <div class="section-title mt-4"><i class="fas fa-map-marker-alt"></i> Your Location</div>
                    <div id="gpsStatus" class="gps-badge gps-loading">
                        <i class="fas fa-spinner fa-spin"></i> Detecting location...
                    </div>
                    <div class="row g-2 mt-2">
                        <div class="col-6">
                            <label class="form-label">Latitude</label>
                            <input class="form-control" id="latDisplay" placeholder="Auto detected" readonly>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Longitude</label>
                            <input class="form-control" id="lngDisplay" placeholder="Auto detected" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <input type="hidden" id="latitude" name="latitude">
            <input type="hidden" id="longitude" name="longitude">

            <button class="btn registration-btn w-100 mt-4" id="registerBtn">
                <i class="fas fa-paper-plane me-2"></i>Submit Registration Application
            </button>
        </form>
    </div>
</div>

<script>
    /* HELPERS */
    function setMsg(id, text, type) { const el=document.getElementById(id); if(!el)return; el.textContent=text; el.className='val-msg '+type; }
    function setFld(id, valid) { const el=document.getElementById(id); if(!el)return; el.classList.toggle('is-valid',valid===true); el.classList.toggle('is-invalid',valid===false); }
    function onlyDigits(e) { e.target.value=e.target.value.replace(/\D/g,''); }

    /* NAME */
    document.getElementById('name').addEventListener('input',function(){
        const v=this.value.trim();
        if(v.length===0){setFld('name',false);setMsg('nameMsg','⚠ Name is required','err');}
        else if(!/^[A-Za-z\s]{3,}$/.test(v)){setFld('name',false);setMsg('nameMsg','⚠ Only letters, min 3 characters','err');}
        else{setFld('name',true);setMsg('nameMsg','✔ Looks good','ok');}
    });

    /* EMAIL */
    document.getElementById('email').addEventListener('input',function(){
        const v=this.value.trim(); const rx=/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,6}$/;
        if(v.length===0){setFld('email',false);setMsg('emailMsg','⚠ Email is required','err');}
        else if(!rx.test(v)){setFld('email',false);setMsg('emailMsg','⚠ Enter valid email like user@domain.com','err');}
        else{setFld('email',true);setMsg('emailMsg','✔ Valid email','ok');}
    });

    /* PHONE */
    const phoneEl=document.getElementById('phone');
    phoneEl.addEventListener('input',onlyDigits);
    phoneEl.addEventListener('input',function(){
        const v=this.value;
        if(v.length===0){setFld('phone',false);setMsg('phoneMsg','⚠ Phone number is required','err');}
        else if(!/^[6-9]\d{9}$/.test(v)){setFld('phone',false);setMsg('phoneMsg',v.length<10?`⚠ ${10-v.length} more digit(s) needed`:'⚠ Must start with 6, 7, 8 or 9','err');}
        else{setFld('phone',true);setMsg('phoneMsg','✔ Valid phone number','ok');}
    });

    /* PASSWORD STRENGTH */
    document.getElementById('password').addEventListener('input',function(){
        const v=this.value; let score=0;
        if(v.length>=8) score++; if(/[A-Z]/.test(v)) score++; if(/[0-9]/.test(v)) score++;
        if(/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(v)) score++;
        const fill=document.getElementById('strengthFill');
        const colors=['','#ef4444','#f59e0b','#3b82f6','#22c55e'];
        const labels=['','⚠ Too weak','⚠ Weak','✔ Fair — add a symbol','✔ Strong password'];
        const widths=['0%','25%','50%','75%','100%'];
        const types=['','err','err','ok','ok'];
        fill.style.width=widths[score]; fill.style.background=colors[score];
        setFld('password',score>=3); setMsg('passMsg',labels[score]||'',types[score]||'');
    });

    /* VEHICLE TYPE */
    document.getElementById('vehicleType').addEventListener('change',function(){
        if(!this.value){setFld('vehicleType',false);setMsg('vehicleTypeMsg','⚠ Please select vehicle type','err');}
        else{setFld('vehicleType',true);setMsg('vehicleTypeMsg','✔','ok');}
    });

    /* VEHICLE NUMBER — Indian format: 2letters + 2digits + 2letters + 4digits */
    document.getElementById('vehicleNo').addEventListener('input',function(){
        this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
        const v=this.value;
        const rx=/^[A-Z]{2}\d{2}[A-Z]{1,2}\d{4}$/;
        if(v.length===0){setFld('vehicleNo',null);setMsg('vehicleNoMsg','','');}
        else if(!rx.test(v)){setFld('vehicleNo',false);setMsg('vehicleNoMsg','⚠ Format: MH12AB1234','err');}
        else{setFld('vehicleNo',true);setMsg('vehicleNoMsg','✔ Valid vehicle number','ok');}
    });

    /* CAPACITY */
    document.getElementById('capacity').addEventListener('input',function(){
        const v=parseInt(this.value);
        if(!this.value){setFld('capacity',null);setMsg('capacityMsg','','');}
        else if(isNaN(v)||v<1){setFld('capacity',false);setMsg('capacityMsg','⚠ Enter valid capacity in kg','err');}
        else{setFld('capacity',true);setMsg('capacityMsg','✔','ok');}
    });

    /* RATE */
    document.getElementById('rateInput').addEventListener('input',function(){
        const v=parseFloat(this.value);
        if(!this.value){setFld('rateInput',null);setMsg('rateMsg','','');}
        else if(isNaN(v)||v<1){setFld('rateInput',false);setMsg('rateMsg','⚠ Enter valid rate (min ₹1/km)','err');}
        else{setFld('rateInput',true);setMsg('rateMsg','✔','ok');}
    });

    /* LICENSE EXPIRY — must be a future date */
    document.getElementById('licenseExpiry').addEventListener('change',function(){
        const today=new Date(); today.setHours(0,0,0,0);
        const chosen=new Date(this.value);
        if(!this.value){setFld('licenseExpiry',false);setMsg('licenseExpiryMsg','⚠ Expiry date is required','err');}
        else if(chosen<=today){setFld('licenseExpiry',false);setMsg('licenseExpiryMsg','⚠ License must not be expired','err');}
        else{setFld('licenseExpiry',true);setMsg('licenseExpiryMsg','✔ Valid expiry date','ok');}
    });

    /* BASE CITY */
    document.getElementById('baseCity').addEventListener('input',function(){
        const v=this.value.trim();
        if(v.length>0 && !/^[A-Za-z\s]{2,}$/.test(v)){setFld('baseCity',false);setMsg('baseCityMsg','⚠ Enter a valid city name','err');}
        else if(v.length>=2){setFld('baseCity',true);setMsg('baseCityMsg','✔','ok');}
        else{setFld('baseCity',null);setMsg('baseCityMsg','','');}
    });

    /* FILE VALIDATION */
    document.getElementById('licenseFile').addEventListener('change',function(){
        const f=this.files[0];
        if(f&&f.size>5*1024*1024){setFld('licenseFile',false);setMsg('licenseMsg','⚠ File must be under 5MB','err');this.value="";}
        else if(f){setFld('licenseFile',true);setMsg('licenseMsg','✔ File selected','ok');}
    });
    document.getElementById('vehicleFile').addEventListener('change',function(){
        const f=this.files[0];
        if(f&&f.size>5*1024*1024){setFld('vehicleFile',false);setMsg('vehicleFileMsg','⚠ File must be under 5MB','err');this.value="";}
        else if(f){setFld('vehicleFile',true);setMsg('vehicleFileMsg','✔ File selected','ok');}
    });

    /* OTP — ORIGINAL LOGIC UNCHANGED */
    let generatedOTP; let isVerified=false;

function verifyOTP() {
    const entered = document.getElementById('otp_input').value.trim();
    const btn = document.getElementById('verifyOTPBtn');
    const errorEl = document.getElementById('otpError');

    if (!entered || entered.length !== 6) {
        errorEl.className = 'val-msg err';
        errorEl.textContent = '⚠ Please enter the 6-digit OTP';
        return;
    }

    btn.disabled = true;
    btn.innerText = 'Verifying...';

    fetch("{% url 'verify_email_otp' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: "otp=" + encodeURIComponent(entered) + "&email=" + encodeURIComponent(document.getElementById('email').value.trim())
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === "success") {
            isVerified = true;
            document.getElementById('otp_verified').value = 'true';
            errorEl.className = 'val-msg ok';
            errorEl.textContent = '✔ Email verified successfully!';
            document.getElementById('otp_input').classList.add('is-valid');
            btn.innerText = '✔ Verified';
            btn.disabled = true;
            btn.style.background = '#198754';
            // Lock email field so it can't be changed after verification
            document.getElementById('email').readOnly = true;
            document.getElementById('sendOTPBtn').disabled = true;
        } else {
            isVerified = false;
            document.getElementById('otp_verified').value = 'false';
            errorEl.className = 'val-msg err';
            errorEl.textContent = '⚠ ' + (data.message || 'Incorrect OTP. Please try again.');
            document.getElementById('otp_input').classList.add('is-invalid');
            btn.innerText = 'Confirm';
            btn.disabled = false;
        }
    })
    .catch(() => {
        errorEl.className = 'val-msg err';
        errorEl.textContent = '⚠ Server error. Please try again.';
        btn.innerText = 'Confirm';
        btn.disabled = false;
    });
}

function sendOTP() {
    const email = document.getElementById('email').value.trim();

    // Email validation
    const emailRegex = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,6}$/;
    if (!email || !emailRegex.test(email)) {
        setMsg('emailMsg', '⚠ Please enter a valid email address!', 'err');
        setFld('email', false);
        return;
    }

    // Disable button while sending
    const btn = document.getElementById("sendOTPBtn");
    btn.disabled = true;
    btn.innerText = "Sending...";

    fetch("{% url 'send_email_otp' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: "email=" + encodeURIComponent(email)
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {

            // Show OTP input box
            document.getElementById("otpBox").style.display = "block";

            // Reset verified state on resend
            isVerified = false;
            document.getElementById('otp_verified').value = 'false';
            document.getElementById('otp_input').value = '';
            document.getElementById('otp_input').className = 'form-control border-success';
            document.getElementById('otpError').textContent = '';
            const vBtn = document.getElementById('verifyOTPBtn');
            vBtn.innerText = 'Confirm'; vBtn.disabled = false; vBtn.style.background = '';
            document.getElementById('email').readOnly = false;

            setMsg('emailMsg', '📩 OTP sent! Check your email.', 'ok');
            setFld('email', true);

            // Button update
            btn.innerText = "Resend OTP";
            btn.disabled = false;

        } else {
            setMsg('emailMsg', '⚠ ' + data.message, 'err');
            setFld('email', false);

            btn.innerText = "Verify";
            btn.disabled = false;
        }
    })
    .catch(() => {
        setMsg('emailMsg', '⚠ Server error while sending OTP.', 'err');
        btn.innerText = "Verify";
        btn.disabled = false;
    });
}

    /* FORM SUBMIT */
    document.getElementById('driverForm').onsubmit=function(e){
        let valid=true; const errors=[];

        const name=document.getElementById('name').value.trim();
        if(!/^[A-Za-z\s]{3,}$/.test(name)){ errors.push("Full name (min 3 letters, only alphabets)"); setFld('name',false); valid=false; }

        const email=document.getElementById('email').value.trim();
        if(!/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,6}$/.test(email)){ errors.push("Valid email address"); setFld('email',false); valid=false; }

        if(!isVerified){ errors.push("Email must be verified via OTP"); valid=false; }

        const phone=document.getElementById('phone').value;
        if(!/^[6-9]\d{9}$/.test(phone)){ errors.push("Valid 10-digit phone number (starts with 6-9)"); setFld('phone',false); valid=false; }

        const pass=document.getElementById('password').value;
        if(pass.length<6){ errors.push("Password (min 6 characters)"); setFld('password',false); valid=false; }

        if(!document.getElementById('vehicleType').value){ errors.push("Vehicle type selection"); setFld('vehicleType',false); valid=false; }

        const vNo=document.getElementById('vehicleNo').value;
        if(vNo && !/^[A-Z]{2}\d{2}[A-Z]{1,2}\d{4}$/.test(vNo)){ errors.push("Valid vehicle number (e.g. MH12AB1234)"); setFld('vehicleNo',false); valid=false; }

        const expiry=document.getElementById('licenseExpiry').value;
        if(!expiry){ errors.push("License expiry date"); setFld('licenseExpiry',false); valid=false; }
        else{ const today=new Date(); today.setHours(0,0,0,0); if(new Date(expiry)<=today){ errors.push("License expiry must be a future date"); setFld('licenseExpiry',false); valid=false; } }

        if(!document.getElementById('licenseFile').files[0]){ errors.push("License photo is required"); setFld('licenseFile',false); valid=false; }
        if(!document.getElementById('vehicleFile').files[0]){ errors.push("Vehicle photo is required"); setFld('vehicleFile',false); valid=false; }

        if(!valid){ e.preventDefault(); alert("Please fix the following:\n\n• "+errors.join("\n• ")); }
        return valid;
    };

    /* GPS — original unchanged */
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
            const lat=pos.coords.latitude; const lng=pos.coords.longitude;
            document.getElementById("latitude").value=lat;
            document.getElementById("longitude").value=lng;
            document.getElementById("latDisplay").value=lat.toFixed(6);
            document.getElementById("lngDisplay").value=lng.toFixed(6);
            document.getElementById("gpsStatus").className="gps-badge gps-success";
            document.getElementById("gpsStatus").innerHTML='<i class="fas fa-circle-check"></i> Location detected successfully!';
        },function(){
            document.getElementById("gpsStatus").className="gps-badge gps-error";
            document.getElementById("gpsStatus").innerHTML='<i class="fas fa-circle-xmark"></i> Location not available — assign manually later';
        });
    } else {
        document.getElementById("gpsStatus").className="gps-badge gps-error";
        document.getElementById("gpsStatus").innerHTML='<i class="fas fa-circle-xmark"></i> GPS not supported in this browser';
    }
</script>
{% endblock %}
