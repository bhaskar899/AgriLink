{% extends "master.html" %}
{% block title %}Forgot Password - AgriLink{% endblock %}

{% block body %}

<div class="back-btn-wrapper">
    <button class="back-btn" onclick="window.history.back()">
        <span class="btn-icon">⬅</span> Back
    </button>
</div>

<style>
/* --- Layout Fixes --- */
body {
    background: radial-gradient(circle at top right, #f0fdf4, #ffffff);
    min-height: 100vh;
}

.back-btn-wrapper {
    margin-top: 100px;
    margin-bottom: 10px;
    margin-left: 30px;
}

.back-btn {
    border: none;
    padding: 10px 24px;
    border-radius: 50px;
    background: #ffffff;
    color: #198754;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.back-btn:hover {
    background: #198754;
    color: #fff;
    transform: translateX(-5px);
}

/* --- Premium Card Design --- */
.forgot-container {
    padding-bottom: 80px;
}

.forgot-card {
    max-width: 500px;
    width: 100%;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(25, 135, 84, 0.1);
    border-radius: 30px;
    padding: 50px 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    transition: all 0.4s ease;
}

.forgot-card:hover {
    box-shadow: 0 30px 60px -12px rgba(25, 135, 84, 0.15);
}

/* --- Decorative Icon --- */
.icon-box {
    width: 80px;
    height: 80px;
    background: #f0fdf4;
    color: #198754;
    font-size: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    margin: 0 auto 25px;
    box-shadow: inset 0 0 0 2px rgba(25, 135, 84, 0.05);
}

.forgot-card h2 {
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
}

.forgot-card p {
    color: #6b7280;
    font-size: 0.95rem;
    line-height: 1.6;
}

/* --- Input Styling --- */
.form-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 10px;
}

.modern-input {
    border: 2px solid #f3f4f6;
    background: #f9fafb;
    border-radius: 16px;
    padding: 14px 20px;
    font-size: 1rem;
    transition: all 0.3s ease;
}

.modern-input:focus {
    background: #fff;
    border-color: #198754;
    box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1);
    outline: none;
}

/* --- Premium Button --- */
.btn-send {
    background: linear-gradient(135deg, #198754, #15803d);
    border: none;
    padding: 16px;
    border-radius: 16px;
    font-weight: 700;
    font-size: 1rem;
    color: white;
    width: 100%;
    margin-top: 15px;
    box-shadow: 0 10px 25px -5px rgba(25, 135, 84, 0.4);
    transition: all 0.3s ease;
}

.btn-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 30px -5px rgba(25, 135, 84, 0.5);
    filter: brightness(1.1);
}

.btn-send:active {
    transform: scale(0.98);
}
</style>

<div class="container d-flex justify-content-center align-items-center forgot-container">
  <div class="forgot-card text-center">

    <div class="icon-box">🔐</div>

    <h2 class="mb-2">Forgot Password?</h2>
    <p class="mb-4">No worries! Enter the email address associated with your account and we'll send you an OTP to reset it.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="text-start mb-4">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-control modern-input" placeholder="name@example.com" required>
      </div>

      <button type="submit" class="btn btn-send">Send Verification OTP</button>
    </form>

    <div class="mt-4">
        <a href="/login/" class="text-success text-decoration-none fw-bold small">Back to Login</a>
    </div>
  </div>
</div>

{% endblock %}
