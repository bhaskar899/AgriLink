{% extends "master.html" %}
{% block title %}Forgot Password{% endblock %}

{% block body %}

<br><br>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card p-4 shadow-lg" style="max-width:650px; width:100%; border-radius:15px; transition:0.3s;">

    <h2 class="text-center mb-4">Forgot Password</h2>

    <form method="POST">
      {% csrf_token %}

      <label class="form-label">Enter your Email</label>
      <input type="email" name="email" class="form-control form-control-lg mb-3" required>

      <button class="btn btn-success btn-lg w-100">Send OTP</button>
    </form>
  </div>
</div>

<style>
  .card:hover { transform: scale(1.02); box-shadow:0 0 18px rgba(0,0,0,0.3); }
</style>
{% endblock %}
