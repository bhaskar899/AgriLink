{% extends 'master.html' %}
{% block title %}Verify Email{% endblock %}

{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script><div class="container d-flex justify-content-center">
  <div class="card p-4 shadow" style="width: 400px;">
    <h4 class="text-center">Verify Email</h4>
    <p class="text-center text-muted">Enter the OTP sent to your email</p>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="otp" maxlength="6" class="form-control mb-3" required>

      <button type="submit" class="btn btn-success w-100">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
