{% extends 'master.html' %}
{% block title %}Payment{% endblock %}
{% block body %}<br><br><br>

<div class="container mt-5 text-center">
  <div class="card shadow-lg p-5 border-0"><br><br>

    <h3 class="mb-3">💳 Pay for {{ product.product }}</h3>
    <p><strong>Farmer:</strong> {{ product.farmer.name }}</p>
    <p><strong>Price per kg:</strong> ₹{{ product.price }}</p>
    <p><strong>Quantity:</strong> {{ order.quantity }} kg</p>
    <h4 class="mt-3 text-success fw-bold">Total Amount: ₹{{ amount }}</h4>

    <button id="rzp-button1" class="btn btn-success btn-lg mt-4">Proceed to Pay ₹{{ amount }}</button>
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ amount|floatformat:0 }}00", // in paise
    "currency": "INR",
    "name": "AgriLink Payment",
    "description": "Payment for {{ product.product }}",
    "image": "https://cdn-icons-png.flaticon.com/512/1164/1164954.png",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        // Redirect to payment success AFTER payment is done
        window.location.href = "/payment_success/{{ order.id }}/";
    },
    "prefill": {
        "name": "{{ request.session.name }}",
        "email": "test@example.com",
        "contact": "9999999999"
    },
    "theme": {"color": "#198754"}
};

var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    e.preventDefault(); // Important! Prevent default page reload
    rzp1.open();         // Open Razorpay payment popup
};
</script>
</div>
{% endblock %}
