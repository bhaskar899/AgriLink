{% extends "master.html" %}
{% block title %}Driver Login{% endblock %}
{% block body %}

<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card mx-auto shadow" style="max-width:480px;">
    <div class="card-body">
      <h3 class="text-center mb-3">🚚 Driver Login</h3>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <!-- Email Field -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input name="email" class="form-control" type="email" placeholder="Enter your email" required>
        </div>

        <!-- Password Field -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" class="form-control" type="password" placeholder="Enter password" required>
        </div>

        <button class="btn btn-success w-100 mt-2">Login</button>
      </form>

      <div class="text-center mt-3">
        <small>Don't have an account?</small><br>
        <a href="/driver/register/" class="text-success fw-bold">Register Here</a>
      </div>

    </div>
  </div>
</div>

{% endblock %}
