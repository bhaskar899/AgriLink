{% extends "master.html" %}
{% block title %}Driver Login | AgriLink Pro{% endblock %}
{% block body %}

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --driver-emerald: #10b981;
    --driver-dark: #0f172a;
    --glass-bg: rgba(255, 255, 255, 0.95);
}

/* White Space Fix: Poora background stretch karne ke liye */
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f8fafc;
}

.auth-wrapper {
    flex-grow: 1;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 160px 20px 80px; /* Card ko navbar se niche lane ke liye */
    position: relative;
}

/* BACK BUTTON: Normal position navbar ke niche */
.back-btn {
    position: absolute;
    top: 120px;
    left: 40px;
    text-decoration: none;
    color: var(--driver-dark);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1000;
    padding: 12px 20px;
    background: white;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: 0.3s ease;
    border: 1px solid #e2e8f0;
}

.back-btn:hover {
    background: var(--driver-dark);
    color: white;
    transform: translateY(-2px);
}

.auth-card {
    max-width: 450px;
    width: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    padding: 45px 35px;
    position: relative;
    z-index: 2;
}

.icon-box {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #059669, #10b981);
    color: white; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; margin: 0 auto 15px;
    box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
}

.auth-header { text-align: center; margin-bottom: 30px; }
.auth-header h2 { font-size: 1.7rem; font-weight: 800; color: var(--driver-dark); }

.form-label { font-weight: 700; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; display: block; }

/* Input with Icons */
.input-group-custom { position: relative; margin-bottom: 20px; }
.input-group-custom i.main-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; z-index: 5; }

.form-control {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 14px;
    padding: 12px 40px 12px 45px; background: #f8fafc; transition: 0.3s;
}

.form-control:focus { border-color: var(--driver-emerald); background: white; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1); outline: none; }

/* Eye Button Style */
.eye-btn {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    z-index: 10;
}

.btn-auth-primary {
    background: var(--driver-dark); color: white; border: none; width: 100%;
    padding: 16px; font-weight: 700; border-radius: 16px; transition: 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}

.btn-auth-primary:hover { background: #1e293b; transform: translateY(-2px); }

.auth-footer { text-align: center; margin-top: 25px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
.auth-link { color: var(--driver-emerald); text-decoration: none; font-weight: 700; }

.alert-custom {
    border-radius: 12px; background: #fef2f2; color: #dc2626;
    padding: 12px; margin-bottom: 20px; font-weight: 600; font-size: 0.85rem;
}

footer { margin-top: 0 !important; }

@media (max-width: 768px) {
    .back-btn { top: 100px; left: 20px; }
}
</style>

<div class="auth-wrapper">
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="auth-card">
        <div class="auth-header">
            <div class="icon-box">
                <i class="fas fa-truck-fast"></i>
            </div>
            <h2>Driver Login</h2>
            <p class="text-muted small">Welcome back, Captain!</p>
        </div>

        {% for message in messages %}
        <div class="alert-custom text-center">
            <i class="fas fa-circle-exclamation me-2"></i> {{ message }}
        </div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}

            <label class="form-label">Email Address</label>
            <div class="input-group-custom">
                <i class="fas fa-envelope main-icon"></i>
                <input type="email" class="form-control" name="email" placeholder="name@email.com" required autofocus>
            </div>

            <label class="form-label">Password</label>
            <div class="input-group-custom">
                <i class="fas fa-lock main-icon"></i>
                <input type="password" class="form-control" name="password" id="passwordField" placeholder="••••••••" required>
                <button type="button" class="eye-btn" onclick="togglePassword()">
                    <i class="fas fa-eye-slash" id="passwordIcon"></i>
                </button>
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="{% url 'forgot_password' %}" class="auth-link small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-auth-primary">
                Login & Start Driving <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p class="text-muted small mb-0">
                New to AgriLink?
                <a href="{% url 'driver_register' %}" class="auth-link">Register Here</a>
            </p>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordField');
    const icon = document.getElementById('passwordIcon');

    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    }
}
</script>

{% endblock %}
