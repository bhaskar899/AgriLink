{% extends "master.html" %}
{% block title %}Reset Password{% endblock %}

{% block body %}
<br><br>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width:650px; width:100%; border-radius: 15px; transition:0.3s;">

    <h2 class="text-center mb-4">Reset Password</h2>

    <form method="POST">
      {% csrf_token %}

      <label class="form-label">New Password</label>
      <input type="password" name="password" class="form-control form-control-lg mb-3" required>

      <label class="form-label">Confirm Password</label>
      <input type="password" name="confirm_password" class="form-control form-control-lg mb-3" required>

      <button class="btn btn-success btn-lg w-100">Reset Password</button>
    </form>

  </div>
</div>

<style>
  .card:hover { transform: scale(1.02); box-shadow:0 0 18px rgba(0,0,0,0.3); }
</style>
{% endblock %}
