{% extends "master.html" %}
{% block title %}Reset Password - AgriLink{% endblock %}

{% block body %}

<div class="back-btn-wrapper">
    <button class="back-btn" onclick="window.history.back()">
        <span class="btn-icon">⬅</span> Back
    </button>
</div>

<style>
/* --- Layout Setup --- */
body {
    background: radial-gradient(circle at top left, #f7fafc, #ffffff);
    min-height: 100vh;
}

.back-btn-wrapper {
    margin-top: 100px;
    margin-bottom: 10px;
    margin-left: 30px;
}

.back-btn {
    border: none;
    padding: 10px 24px;
    border-radius: 50px;
    background: #ffffff;
    color: #198754;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.06);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
}

.back-btn:hover {
    background: #198754;
    color: #fff;
    transform: translateX(-5px);
}

/* --- Premium Reset Card --- */
.reset-container {
    padding-bottom: 80px;
    display: flex;
    justify-content: center;
}

.reset-card {
    max-width: 500px;
    width: 100%;
    background: #ffffff;
    border-radius: 30px;
    padding: 50px 40px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
    border: 1px solid #f0f0f0;
    transition: all 0.4s ease;
}

.reset-card:hover {
    box-shadow: 0 30px 60px -12px rgba(25, 135, 84, 0.12);
}

/* --- Header Section --- */
.icon-shield {
    width: 80px;
    height: 80px;
    background: #e8f5e9;
    color: #198754;
    font-size: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 24px;
    margin: 0 auto 25px;
}

.reset-card h2 {
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: -0.5px;
}

.reset-card p {
    color: #718096;
    font-size: 0.95rem;
    margin-bottom: 35px;
}

/* --- Modern Input Group --- */
.input-block {
    text-align: left;
    margin-bottom: 25px;
}

.form-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-weight: 700;
    color: #4a5568;
    margin-bottom: 8px;
    display: block;
}

.reset-input {
    border: 2px solid #edf2f7;
    background: #f8fafc;
    border-radius: 15px;
    padding: 14px 20px;
    font-size: 1rem;
    transition: all 0.3s ease;
    width: 100%;
}

.reset-input:focus {
    background: #fff;
    border-color: #198754;
    box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1);
    outline: none;
}

/* --- Reset Button --- */
.btn-reset {
    background: linear-gradient(135deg, #198754, #15803d);
    border: none;
    padding: 16px;
    border-radius: 15px;
    font-weight: 700;
    font-size: 1.05rem;
    color: white;
    width: 100%;
    margin-top: 10px;
    box-shadow: 0 10px 25px -5px rgba(25, 135, 84, 0.4);
    transition: all 0.3s ease;
}

.btn-reset:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 30px -5px rgba(25, 135, 84, 0.5);
    filter: brightness(1.05);
}

.btn-reset:active {
    transform: scale(0.98);
}
</style>

<div class="reset-container mt-5">
  <div class="reset-card text-center">

    <div class="icon-shield">🛡️</div>

    <h2 class="mb-2">Set New Password</h2>
    <p>Choose a strong and secure password that you haven't used before.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="input-block">
          <label class="form-label">New Password</label>
          <input type="password" name="password" class="reset-input" placeholder="Min. 8 characters" required>
      </div>

      <div class="input-block">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="reset-input" placeholder="Repeat password" required>
      </div>

      <button type="submit" class="btn btn-reset">Update Password</button>
    </form>

    <div class="mt-4 pt-2">
        <p class="small text-muted mb-0">Security Tip: Use a mix of letters, numbers, and symbols.</p>
    </div>
  </div>
</div>

{% endblock %}
