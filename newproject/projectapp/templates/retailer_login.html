{% extends 'master.html' %}
{% block title %}Retailer Login - AgriLink{% endblock %}
{% block body %}

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --retail-blue: #0d6efd;
    --retail-dark: #0f172a;
    --glass-bg: rgba(255, 255, 255, 0.95);
    --primary-green: #198754;
}

/* 1. White Space Fix: Body ko flex banaya taaki footer hamesha bottom par rahe */
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f8fafc;
}

/* 2. Wrapper: Flex-grow se white space khatam ho jayega */
.auth-wrapper {
    flex-grow: 1;
    background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 160px 20px 80px;
    position: relative;
}

/* 3. Back Button: Navbar ke niche normal position par */
.back-btn {
    position: absolute;
    top: 120px;
    left: 40px;
    text-decoration: none;
    color: var(--retail-dark);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 1000;
    padding: 12px 20px;
    background: white;
    border-radius: 50px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: 0.3s ease;
    border: 1px solid #e2e8f0;
}

.back-btn:hover {
    background: var(--primary-green);
    color: white;
    transform: translateY(-2px);
}

.auth-card {
    max-width: 450px;
    width: 100%;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
    padding: 45px 35px;
    position: relative;
    z-index: 2;
}

.icon-box {
    width: 70px; height: 70px;
    background: linear-gradient(135deg, #198754, #28a745);
    color: white; border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem; margin: 0 auto 15px;
}

.auth-header { text-align: center; margin-bottom: 30px; }
.auth-header h2 { font-size: 1.7rem; font-weight: 800; color: var(--retail-dark); }

.form-label { font-weight: 700; font-size: 0.85rem; color: #64748b; margin-bottom: 8px; display: block; }

/* Input Group with Icons */
.input-group-custom { position: relative; margin-bottom: 20px; }
.input-group-custom i.main-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94a3b8; z-index: 5; }

.form-control {
    width: 100%; border: 1.5px solid #e2e8f0; border-radius: 14px;
    padding: 12px 40px 12px 45px; background: #f8fafc; transition: 0.3s;
}

.form-control:focus { border-color: var(--primary-green); background: white; box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1); outline: none; }

/* Eye Button */
.eye-btn {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    z-index: 10;
}

.btn-auth-primary {
    background: var(--retail-dark); color: white; border: none; width: 100%;
    padding: 16px; font-weight: 700; border-radius: 16px; transition: 0.3s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
}

.btn-auth-primary:hover { background: #1e293b; transform: translateY(-2px); }

.auth-footer { text-align: center; margin-top: 25px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
.auth-link { color: var(--primary-green); text-decoration: none; font-weight: 700; }

footer { margin-top: 0 !important; }

@media (max-width: 768px) {
    .back-btn { top: 100px; left: 20px; }
    .auth-wrapper { padding-top: 180px; }
}
</style>

<div class="auth-wrapper">
    <a href="javascript:history.back()" class="back-btn">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <div class="auth-card">
        <div class="auth-header">
            <div class="icon-box">
                <i class="fas fa-store"></i>
            </div>
            <h2>Retailer Login</h2>
            <p class="text-muted small">Access your shop dashboard</p>
        </div>

        {% for message in messages %}
            <div class="alert alert-danger py-2 small text-center" style="border-radius: 10px;">
                {{ message }}
            </div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}

            <label class="form-label">Username</label>
            <div class="input-group-custom">
                <i class="fas fa-user main-icon"></i>
                <input type="text" class="form-control" name="name" placeholder="Enter username" required autofocus>
            </div>

            <label class="form-label">Password</label>
            <div class="input-group-custom">
                <i class="fas fa-lock main-icon"></i>
                <input type="password" class="form-control" name="password" id="passwordField" placeholder="••••••••" required>
                <button type="button" class="eye-btn" onclick="togglePassword()">
                    <i class="fas fa-eye-slash" id="passwordIcon"></i>
                </button>
            </div>

            <div class="d-flex justify-content-end mb-4">
                <a href="{% url 'forgot_password' %}" class="auth-link small">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-auth-primary w-100">
                Login to Dashboard <i class="fas fa-sign-in-alt"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p class="text-muted small mb-0">
                Don't have an account? <a href="{% url 'retailer_register' %}" class="auth-link">Register Here</a>
            </p>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordField');
    const icon = document.getElementById('passwordIcon');

    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    }
}
</script>

{% endblock %}
