{% extends 'master.html' %}
{% block title %}Retailer Login{% endblock %}
{% block body %}

<div class="container mt-5"><br>
<br>

  <h2 class="text-center">Retailer Login</h2><br>

  <form method="post" action="{% url 'retailer_login' %}">
                                    {% csrf_token %}

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="name" placeholder="Enter username">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Enter password">
    </div>

    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
</div>

{% endblock %}
