{% extends 'master.html' %}
{% block title %}Retailer Login{% endblock %}
{% block body %}

<br><br>
<style>
.btn-primary-custom {
  background-color: #0056D6 !important;
  border: none !important;
  color: white !important;
  padding: 10px;
  border-radius: 8px;
  font-weight: 500;
  transition: 0.3s ease;
}
.btn-primary-custom:hover {
  background-color: #003C99 !important;
  transform: scale(1.03);
}
.card:hover {
  transform: scale(1.02);
  box-shadow:0 0 18px rgba(0,0,0,0.3);
}
.is-invalid { border-color: red !important; }
.invalid-feedback { display: block; color: red; font-size: 0.9rem; }
</style>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width:650px; width:100%; border-radius:15px; transition:0.3s;">
    <h2 class="text-center mb-4">Retailer Login</h2>

    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} text-center">{{ message }}</div>
    {% endfor %}

    <form method="post" action="{% url 'retailer_login' %}" id="retailerLoginForm">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control form-control-lg" name="name" placeholder="Enter your name" required>
        <div class="invalid-feedback">Please enter your username.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control form-control-lg" name="password" placeholder="Enter password" id="passwordField" required>
          <button type="button" class="btn btn-outline-secondary" id="togglePassword">
            <i class="fa fa-eye-slash" id="passwordIcon"></i>
          </button>
        </div>
        <div class="invalid-feedback">Please enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100" id="loginBtn">Login</button>

      <div class="text-center mt-3">
        <a href="{% url 'forgot_password' %}">Forgot Password?</a>
      </div>
    </form>
  </div>
</div>

<script>
// Password show/hide toggle
document.getElementById('togglePassword').addEventListener('click', function() {
    const passwordInput = document.getElementById('passwordField');
    const icon = document.getElementById('passwordIcon');
    if(passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    } else {
        passwordInput.type = "password";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    }
});

// Simple front-end validation
const form = document.getElementById('retailerLoginForm');
form.addEventListener('submit', function(e) {
    let valid = true;
    const username = form.querySelector('input[name="name"]');
    const password = form.querySelector('input[name="password"]');

    if(username.value.trim() === "") {
        username.classList.add('is-invalid');
        valid = false;
    } else {
        username.classList.remove('is-invalid');
    }

    if(password.value.trim() === "") {
        password.classList.add('is-invalid');
        valid = false;
    } else {
        password.classList.remove('is-invalid');
    }

    if(!valid) e.preventDefault();
});
</script>

{% endblock %}
