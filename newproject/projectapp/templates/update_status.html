{% extends 'master.html' %}
{% block title %}Update Status | AgriLink{% endblock %}
{% block body %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root { --primary-green: #198754; --dark-green: #16423C; }
    body { background: linear-gradient(135deg, #f0f9f4 0%, #e6f0eb 100%); font-family: 'Plus Jakarta Sans', sans-serif; }
    .main-wrapper { margin-top: 110px; padding-bottom: 80px; }

    .update-card {
        background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
        border-radius: 30px; border: 1px solid rgba(255,255,255,0.7);
        padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.05);
    }
    .form-label { font-weight: 700; color: var(--dark-green); font-size: 0.9rem; margin-bottom: 8px; }
    .form-control, .form-select {
        border-radius: 15px; padding: 12px 20px; border: 1px solid #d1e7dd; background: #f8faf9;
    }
    .location-badge {
        background: #e8f5e9; border-radius: 15px; padding: 20px; border: 1px dashed var(--primary-green);
    }
    .btn-update {
        background: var(--primary-green); color: white; border-radius: 15px;
        padding: 15px 40px; font-weight: 800; transition: 0.3s; border: none;
    }
    .btn-update:hover { background: var(--dark-green); transform: translateY(-3px); }
</style>

<div class="container main-wrapper">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="update-card">
                <div class="text-center mb-5">
                    <div class="bg-success d-inline-block p-3 rounded-circle mb-3 text-white">
                        <i class="fas fa-truck-loading fa-2x"></i>
                    </div>
                    <h3 class="fw-800" style="color: var(--dark-green);">Update Order Journey</h3>
                    <p class="text-muted">Modify status and assign logistics for Order #{{ order.id }}</p>
                </div>

                <form method="POST">
                    {% csrf_token %}

                    <div class="row g-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" value="{{ order.product.product }}" readonly>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Current Status</label>
                            <select class="form-select fw-bold text-success" name="status" required>
                                {% for s,label in order.STATUS_CHOICES %}
                                    <option value="{{ s }}" {% if order.status == s %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Assign Delivery Partner</label>
                        <select class="form-select" name="driver">
                            <option value="">-- No Driver Assigned --</option>
                            {% for d in drivers %}
                                <option value="{{ d.id }}" {% if order.driver.id == d.id %}selected{% endif %}>
                                    🚚 {{ d.name }} ({{ d.vehicle_type }}) - {{ d.location }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="location-badge mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-bold text-success"><i class="fas fa-map-marker-alt me-2"></i>Live Coordinates</span>
                            <button type="button" class="btn btn-sm btn-success rounded-pill px-3" onclick="getLocation()">
                                Get Current GPS
                            </button>
                        </div>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="text" class="form-control bg-white" id="lat" name="current_lat" value="{{ order.current_lat }}" placeholder="Latitude" readonly>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control bg-white" id="lng" name="current_lng" value="{{ order.current_lng }}" placeholder="Longitude" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-update flex-grow-1">Update Shipment</button>
                        <a href="javascript:history.back()" class="btn btn-light rounded-pill px-4 border fw-bold">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function getLocation(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
            document.getElementById("lat").value = pos.coords.latitude.toFixed(6);
            document.getElementById("lng").value = pos.coords.longitude.toFixed(6);
        });
    }
}
</script>
{% endblock %}
