{% extends 'master.html' %}
{% block title %}Update Order Status{% endblock %}
{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center mb-4">🚚 Update Order Status</h3>

    <form method="POST" action="{% url 'update_status' order.id %}">
      {% csrf_token %}

      <!-- Order Info -->
      <div class="mb-3">
        <label class="form-label"><strong>Order ID:</strong></label>
        <input type="text" class="form-control" value="{{ order.id }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label"><strong>Product:</strong></label>
        <input type="text" class="form-control" value="{{ order.product.product }}" readonly>
      </div>

      <!-- Status dropdown -->
      <div class="mb-3">
        <label class="form-label"><strong>Status</strong></label>
        <select class="form-select" name="status" required>
          <option value="">-- Select Status --</option>
          {% for s,label in order.STATUS_CHOICES %}
            <option value="{{ s }}" {% if order.status == s %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Driver Selection -->
      <div class="mb-3">
        <label class="form-label"><strong>Assign Driver</strong></label>
        <select class="form-select" name="driver">
          <option value="">-- Select Driver --</option>
          {% for d in drivers %}
            <option value="{{ d.id }}" {% if order.driver and order.driver.id == d.id %}selected{% endif %}>
              {{ d.name }} — {{ d.vehicle_type }} — {{ d.location }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Location -->
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label"><strong>Current Latitude</strong></label>
          <input type="text" class="form-control" id="lat" name="current_lat"
                 value="{{ order.current_lat }}" readonly>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label"><strong>Current Longitude</strong></label>
          <input type="text" class="form-control" id="lng" name="current_lng"
                 value="{{ order.current_lng }}" readonly>
        </div>
      </div>

      <div class="mb-3 text-center">
        <button type="button" class="btn btn-outline-primary" onclick="getLocation()">📍 Get My Location</button>
      </div>

      <!-- Submit -->
      <div class="text-center">
        <button type="submit" class="btn btn-success btn-lg">Update</button>
        <a href="/farmer_order/" class="btn btn-secondary btn-lg ms-2">Back</a>
      </div>
    </form>
  </div>
</div>

<script>
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        document.getElementById("lat").value = pos.coords.latitude.toFixed(6);
        document.getElementById("lng").value = pos.coords.longitude.toFixed(6);
      });
  }
}
</script>
{% endblock %}
