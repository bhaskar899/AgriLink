{% extends 'master.html' %}
{% block title %}Update Order Status{% endblock %}
{% block body %}

<div class="container mt-5">
  <h2>Update Order Status - Order #{{ order.id }}</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label>Status</label>
      <select name="status" class="form-control">
        <option value="Pending" {% if order.status == "Pending" %}selected{% endif %}>Pending</option>
        <option value="Packed" {% if order.status == "Packed" %}selected{% endif %}>Packed</option>
        <option value="Dispatched" {% if order.status == "Dispatched" %}selected{% endif %}>Dispatched</option>
        <option value="Out for Delivery" {% if order.status == "Out for Delivery" %}selected{% endif %}>Out for Delivery</option>
        <option value="Delivered" {% if order.status == "Delivered" %}selected{% endif %}>Delivered</option>
      </select>
    </div>

    <div class="mb-3">
      <label>Current Latitude</label>
      <input type="text" class="form-control" name="current_lat" placeholder="e.g., 18.5204" value="{{ order.current_lat }}">
    </div>

    <div class="mb-3">
      <label>Current Longitude</label>
      <input type="text" class="form-control" name="current_lng" placeholder="e.g., 73.8567" value="{{ order.current_lng }}">
    </div>

    <button type="submit" class="btn btn-success">Update Status</button>
  </form>
</div>

{% endblock %}
