{% extends 'master.html' %}
{% block title %}Retailer Registration{% endblock %}
{% block body %}

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<style>
    :root { --r-blue: #0d6efd; --r-dark: #0f172a; }

    body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
    }

    .auth-wrapper {
        flex-grow: 1;
        background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 160px 20px 80px;
        position: relative;
    }

    /* Back Button - Same Position as Farmer */
    .back-btn {
        position: absolute;
        top: 110px;
        left: 40px;
        text-decoration: none;
        color: var(--r-dark);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 1000;
        padding: 12px 22px;
        background: white;
        border-radius: 50px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        border: 1px solid #e2e8f0;
    }
    .back-btn:hover { background: var(--r-dark); color: white; transform: translateY(-2px); }

    .auth-card {
        width: 100%;
        max-width: 850px;
        background: white;
        border-radius: 30px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.05);
        padding: 40px;
    }

    .section-title {
        color: var(--r-blue);
        font-weight: 800;
        font-size: 0.85rem;
        text-transform: uppercase;
        border-bottom: 2px solid #f1f5f9;
        margin: 20px 0 15px;
        padding-bottom: 5px;
    }

    .form-label { font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 5px; display: block; }
    .form-control { border-radius: 12px; padding: 10px 15px; border: 1.5px solid #e2e8f0; background: #f8fafc; margin-bottom: 15px; }

    /* Eye Button Styling */
    .pass-group { position: relative; }
    .eye-btn { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #94a3b8; z-index: 10; }

    .submit-btn {
        background: var(--r-dark);
        color: white;
        border: none;
        padding: 16px;
        border-radius: 16px;
        font-weight: 700;
        width: 100%;
        margin-top: 20px;
        transition: 0.3s;
    }
    .submit-btn:disabled { background: #94a3b8; }
</style>

<div class="auth-wrapper">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="auth-card">
        <h2 class="text-center fw-bold">Retailer Registration</h2>
        <p class="text-center text-muted small mb-4">Register your business to start buying from farmers</p>

        <form method="post" id="retailerForm" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 border-end pe-md-4">
                    <div class="section-title">Owner & Contact</div>

                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required>

                    <label class="form-label">Email Address</label>
                    <div class="input-group mb-3 gap-2">
                        <input type="email" class="form-control" name="email" id="emailInput" required>
                        <button type="button" class="btn btn-primary rounded-3 btn-sm" onclick="sendOTP()">Send OTP</button>
                    </div>

                    <div id="otpBox" style="display:none;">
                        <label class="form-label text-primary">Enter OTP</label>
                        <input type="text" class="form-control border-primary" id="otpInput">
                    </div>

                    <label class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" name="contact" maxlength="10" required>

                    <label class="form-label">Shop Address</label>
                    <input type="text" class="form-control" name="address" required>

                    <div class="row">
                        <div class="col-6"><label class="form-label">City</label><input type="text" class="form-control" name="city" required></div>
                        <div class="col-6"><label class="form-label">Pincode</label><input type="text" class="form-control" name="pincode" maxlength="6" required></div>
                    </div>
                </div>

                <div class="col-md-6 ps-md-4">
                    <div class="section-title">Business Verification</div>

                    <label class="form-label">Shop / Trade Name</label>
                    <input type="text" class="form-control" name="shop_number" placeholder="Enter Business Name" required>

                    <label class="form-label">GST Number</label>
                    <input type="text" class="form-control" name="gst_number" id="gstInput" placeholder="15-Digit GST" maxlength="15" style="text-transform: uppercase;" required>

                    <label class="form-label">Upload GST Certificate</label>
                    <input type="file" class="form-control" id="gstFile" required>
                    <small id="gstStatus" class="fw-bold d-block mb-3"></small>

                    <div class="section-title">Security</div>

                    <div class="pass-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="pass" required>
                        <i class="fas fa-eye eye-btn" onclick="togglePass('pass')"></i>
                    </div>

                    <div class="pass-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPass" required>
                        <i class="fas fa-eye eye-btn" onclick="togglePass('confirmPass')"></i>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="regBtn">Register Business</button>

            <div class="text-center mt-3">
                <small>Already registered? <a href="{% url 'retailer_login' %}" class="text-primary fw-bold text-decoration-none">Login Here</a></small>
            </div>
        </form>
    </div>
</div>

<script>
    // 1. Password Toggle (Simple)
    function togglePass(id) {
        const input = document.getElementById(id);
        const icon = event.target;
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

function sendOTP() {
    const email = document.getElementById("emailInput").value;

    if (!email) {
        alert("Enter email first!");
        return;
    }

    fetch("{% url 'send_email_otp' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        body: "email=" + encodeURIComponent(email)
    })
    .then(response => response.json())
    .then(data => {
        console.log(data);   // 🔎 debug

        if (data.status === "success") {
            alert("OTP sent successfully!");
            document.getElementById("otpBox").style.display = "block";
        } else {
            alert(data.message);
        }
    })
    .catch(error => {
        console.log("Error:", error);
        alert("Server error");
    });
}


    // 3. GST OCR (Simple Logic)
    document.getElementById('gstFile').onchange = async function() {
        const gstNum = document.getElementById('gstInput').value.toUpperCase();
        const status = document.getElementById('gstStatus');

        if(gstNum.length < 15) {
            alert("Please enter a valid 15-digit GST number first!");
            this.value = "";
            return;
        }


        status.innerText = "Scanning Certificate...";
        status.className = "text-warning";

        try {
            const worker = await Tesseract.createWorker('eng');
            const { data: { text } } = await worker.recognize(this.files[0]);
            await worker.terminate();

            if(text.toUpperCase().includes(gstNum)) {
                status.innerText = "✅ GST Verified Successfully!";
                status.className = "text-success";
            } else {
                status.innerText = "❌ GST Mismatch in Document";
                status.className = "text-danger";
            }
        } catch(e) {
            status.innerText = "Scanning Error";
        }
    };
</script>
{% endblock %}
