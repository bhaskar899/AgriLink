{% extends 'master.html' %}
{% block title %}Retailer Register{% endblock %}
{% block body %}

<div class="container mt-5">
  <h2 class="text-center">Retailer Registration</h2>

  <form method="post" action="">
                                          {% csrf_token %}

    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="name" placeholder="Enter username">
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email address</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter email">
    </div>

    <div class="mb-3">
      <label for="address" class="form-label">Address</label>
      <input type="text" class="form-control" id="address" name="address" placeholder="Enter Address">
    </div>

     <div class="form-group">
                <label>Select Gender:-</label>
                &nbsp;
                <input type="radio" class="form-check-input" value="Male" name="gender" required>
                <label class="form-check-label">Male</label>&nbsp;&nbsp;

                <input type="radio" class="form-check-input" value="Female" name="gender" required>
                <label class="form-check-label">Female</label>&nbsp;&nbsp;

                <input type="radio" class="form-check-input" value="Other" name="gender" required>
                <label class="form-check-label" >Other</label>

            </div>

    <div class="mb-3">
      <label for="contact" class="form-label">Contact Number</label>
      <input type="text" class="form-control" id="contact" name="contact" placeholder="Enter contact number">
    </div>

    <div class="mb-3">
      <label for="password1" class="form-label">Password</label>
      <input type="password" class="form-control" id="password1" name="password" placeholder="Enter password">
    </div>

    <div class="mb-3">
      <label for="password2" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="password2" name="password" placeholder="Confirm password">
    </div>

    <button type="submit" class="btn btn-success w-100">Register</button>
  </form>
</div>

{% endblock %}
