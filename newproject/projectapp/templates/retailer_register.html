{% extends 'master.html' %}
{% block title %}Retailer Register{% endblock %}
{% block body %}
<br><br>
<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width:750px; width:100%; border-radius:15px; transition:0.3s;">

    <h2 class="text-center mb-4">Retailer Registration</h2>

    <form method="post" action="">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control form-control-lg" name="name" placeholder="Enter username">
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control form-control-lg" name="email" placeholder="Enter email">
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <input type="text" class="form-control form-control-lg" name="address" placeholder="Enter Address">
      </div>

      <label class="form-label">Select Gender:</label><br>

      <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" value="Male" name="gender" required>
        <label class="form-check-label">Male</label>
      </div>

      <div class="form-check form-check-inline">
        <input type="radio" class="form-check-input" value="Female" name="gender" required>
        <label class="form-check-label">Female</label>
      </div>

      <div class="form-check form-check-inline mb-3">
        <input type="radio" class="form-check-input" value="Other" name="gender" required>
        <label class="form-check-label">Other</label>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Number</label>
        <input type="text" class="form-control form-control-lg" name="contact" placeholder="Enter contact number">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control form-control-lg" name="password" placeholder="Enter password">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control form-control-lg" name="confirm_password" placeholder="Confirm password">
      </div>

      <button type="submit" class="btn btn-success btn-lg w-100">Register</button>

      <!-- 🔥 LOGIN REDIRECT ADDED BELOW -->
      <p class="text-center mt-3">
        Already have an account?
        <a href="{% url 'retailer_login' %}" class="text-primary"><strong>Login Here</strong></a>
      </p>

    </form>

  </div>
</div>

<style>
  .card:hover { transform: scale(1.02); box-shadow:0 0 18px rgba(0,0,0,0.3); }
</style>

{% endblock %}
