{% extends 'master.html' %}
{% block title %}Farmer Login{% endblock %}
{% block body %}
<br><br>

<style>

  .btn-primary-custom {
  background-color: #0056D6 !important;
  border: none !important;
  color: white !important;
  padding: 10px;
  border-radius: 8px;
  font-weight: 500;
  transition: 0.3s ease;
}

.btn-primary-custom:hover {
  background-color: #003C99 !important;
  transform: scale(1.03);
}

</style>

<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width:650px; width:100%; border-radius:15px; transition:0.3s;">

    <h2 class="text-center mb-4">Farmer Login</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'farmer_login' %}">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control form-control-lg" name="name" placeholder="Enter username">
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control form-control-lg" name="password" placeholder="Enter password">
      </div>

      <button type="submit" class="btn btn-primary-custom w-100">Login</button>
    </form>

    <div class="text-center mt-3">
      <a href="{% url 'forgot_password' %}">Forgot Password?</a>
    </div>

  </div>
</div>

<style>
  .card:hover { transform: scale(1.02); box-shadow:0 0 18px rgba(0,0,0,0.3); }
</style>

{% endblock %}
