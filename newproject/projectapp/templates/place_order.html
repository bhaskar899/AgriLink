{% extends 'master.html' %}
{% block title %}Place Order{% endblock %}
{% block body %}
<div class="container mt-5">
  <div class="card shadow-lg p-4 border-0">
    <h3 class="text-center text-success mb-4">🛒 Place Order for {{ product.product }}</h3>

    <form method="POST" action="{% url 'place_order' product.id %}">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Retailer Name</label>
        <input type="text" class="form-control" value="{{ request.session.name }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Product</label>
        <input type="text" class="form-control" value="{{ product.product }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Price (₹ per kg)</label>
        <input type="text" class="form-control" value="{{ product.price }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Available Quantity (kg)</label>
        <input type="text" class="form-control" value="{{ product.quantity }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Enter Quantity to Buy (kg)</label>
        <input type="number" class="form-control" name="quantity" min="1" max="{{ product.quantity }}" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Number</label>
        <input type="text" class="form-control" name="contact" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Delivery Address (Full)</label>
        <textarea class="form-control" name="address" rows="2" required></textarea>
      </div>

      <button type="submit" class="btn btn-success w-100 btn-lg">Proceed to Payment</button>
    </form>
  </div>
</div>
{% endblock %}
