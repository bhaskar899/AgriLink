{% extends "master.html" %}
{% block title %}My Profile{% endblock %}

{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width:550px; border-radius:20px;">
    <div class="text-center">
      {% if user.profile_image %}
        <img src="{{ user.profile_image.url }}" class="rounded-circle shadow" style="width:140px;height:140px;object-fit:cover;border:4px solid #198754;">
      {% else %}
        <img src="/static/images/no-image.jpg" class="rounded-circle shadow" style="width:140px;height:140px;object-fit:cover;border:4px solid #198754;">
      {% endif %}
      <h3 class="mt-3">{{ user.name }}</h3>
    </div>

    <hr>

    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Contact:</strong> {{ user.contact }}</p>
    <p><strong>Gender:</strong> {{ user.gender }}</p>
    <p><strong>Address:</strong><br> {{ user.address }}</p>

    <hr>

    <a href="/profile_update/" class="btn btn-success w-100 py-2 rounded-3">Update Profile</a>

  </div>
</div>
{% endblock %}
