{% extends "master.html" %}
{% block title %}My Profile{% endblock %}

{% block body %}
<div class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width:550px; border-radius:20px;">
    <div class="text-center">
      {% if user.profile_image %}
        <img src="{{ user.profile_image.url }}" class="rounded-circle shadow" style="width:140px;height:140px;object-fit:cover;border:4px solid #198754;">
      {% else %}
        <img src="/static/images/no-image.jpg" class="rounded-circle shadow" style="width:140px;height:140px;object-fit:cover;border:4px solid #198754;">
      {% endif %}
      <h3 class="mt-3">{{ user.name }}</h3>
    </div>

    <hr>

    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Contact:</strong> {{ user.contact }}</p>
    <p><strong>Gender:</strong> {{ user.gender }}</p>
    <p><strong>Address:</strong><br> {{ user.address }}</p>

    <hr>

    <a href="/profile_update/" class="btn btn-success w-100 py-2 rounded-3">Update Profile</a>

  </div>
</div>
{% endblock %}
