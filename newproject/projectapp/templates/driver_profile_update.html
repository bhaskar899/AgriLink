{% extends "master.html" %}
{% block title %}Update Driver Profile{% endblock %}

{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card p-4 mx-auto shadow-lg rounded-4" style="max-width:650px;">
    <h3 class="text-center mb-4">Update Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <!-- Driver fields -->
      <label class="fw-bold">Name</label>
      <input type="text" name="name" class="form-control mb-3 rounded-3" value="{{ driver.name }}" required>

      <label class="fw-bold">Email</label>
      <input type="email" name="email" class="form-control mb-3 rounded-3" value="{{ driver.email }}" disabled>

      <label class="fw-bold">Phone</label>
      <input type="text" name="phone" class="form-control mb-3 rounded-3" value="{{ driver.phone }}">
      {% if profile.phone_verified %}
        <span class="badge bg-success">Verified</span>
      {% endif %}

      <label class="fw-bold">Location</label>
      <input type="text" name="location" class="form-control mb-3 rounded-3" value="{{ driver.location }}">

      <label class="fw-bold">Vehicle Type</label>
      <select name="vehicle_type" class="form-control mb-3 rounded-3">
        {% for v, display in driver.VEHICLE_CHOICES %}
          <option value="{{ v }}" {% if driver.vehicle_type == v %}selected{% endif %}>{{ display }}</option>
        {% endfor %}
      </select>

      <label class="fw-bold">Vehicle Number</label>
      <input type="text" name="vehicle_number" class="form-control mb-3 rounded-3" value="{{ driver.vehicle_number }}">

      <label class="fw-bold">Capacity (kg)</label>
      <input type="number" name="capacity" class="form-control mb-3 rounded-3" value="{{ driver.capacity_kg }}">

      <label class="fw-bold">Rate per km</label>
      <input type="number" step="0.01" name="rate_per_km" class="form-control mb-3 rounded-3" value="{{ driver.rate_per_km }}">

      <!-- Profile fields -->
      <label class="fw-bold">License Issue Date</label>
      <input type="date" name="license_issue_date" class="form-control mb-3 rounded-3" value="{{ profile.license_issue_date }}">

      <label class="fw-bold">License Expiry Date</label>
      <input type="date" name="license_expiry_date" class="form-control mb-3 rounded-3" value="{{ profile.license_expiry_date }}">

      <label class="fw-bold">Driver Photo</label>
      <input type="file" name="driver_photo" class="form-control mb-3 rounded-3">

      <label class="fw-bold">License Document</label>
      <input type="file" name="license_doc" class="form-control mb-3 rounded-3">

      <label class="fw-bold">Vehicle Photo</label>
      <input type="file" name="vehicle_photo" class="form-control mb-4 rounded-3">

      <button class="btn btn-success w-100 py-2 rounded-3">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
