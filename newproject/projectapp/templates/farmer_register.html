{% extends 'master.html' %}
{% block title %}Farmer Register{% endblock %}
{% block body %}
<br><br>
<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width: 750px; width: 100%; border-radius: 15px; transition: 0.3s;">
      <h2 class="text-center mb-4" style="font-weight:600;">Farmer Registration</h2>

      <form method="post" action="">
        {% csrf_token %}

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control form-control-lg" id="username" name="name" placeholder="Enter username">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="Enter email">
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control form-control-lg" id="address" name="address" placeholder="Enter Address">
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Select Gender</label><br>

          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" value="Male" name="gender" required>
            <label class="form-check-label">Male</label>
          </div>

          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" value="Female" name="gender" required>
            <label class="form-check-label">Female</label>
          </div>

          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" value="Other" name="gender" required>
            <label class="form-check-label">Other</label>
          </div>
        </div>

        <div class="mb-3">
          <label for="contact" class="form-label">Contact Number</label>
          <input type="text" class="form-control form-control-lg" id="contact" name="contact" placeholder="Enter contact number">
        </div>

        <div class="mb-3">
          <label for="password1" class="form-label">Password</label>
          <input type="password" class="form-control form-control-lg" id="password1" name="password" placeholder="Enter password">
        </div>

        <div class="mb-3">
          <label for="password2" class="form-label">Confirm Password</label>
          <input type="password" class="form-control form-control-lg" id="password2" name="confirm_password" placeholder="Confirm password">
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">Register</button>

        <!-- 🔥 Farmer Login Redirect -->
        <p class="text-center mt-3">
          Already have an account?
          <a href="{% url 'farmer_login' %}" class="text-primary"><strong>Login Here</strong></a>
        </p>

      </form>
  </div>
</div>

<style>
  .card:hover {
    transform: scale(1.02);
    box-shadow: 0px 0px 18px rgba(0,0,0,0.3);
  }
</style>
{% endblock %}
