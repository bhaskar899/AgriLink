{% extends 'master.html' %}
{% block title %}Farmer Registration{% endblock %}
{% block body %}

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

<style>
    :root { --f-green: #198754; --f-dark: #0f172a; }
    body { display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }

    .auth-wrapper { flex-grow: 1; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); display: flex; justify-content: center; align-items: center; padding: 160px 20px 80px; position: relative; }

    .back-btn { position: absolute; top: 110px; left: 40px; text-decoration: none; color: var(--f-dark); font-weight: 700; display: flex; align-items: center; gap: 8px; z-index: 1000; padding: 12px 22px; background: white; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }

    .auth-card { width: 100%; max-width: 850px; background: white; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.05); padding: 40px; }
    .section-title { color: var(--f-green); font-weight: 800; font-size: 0.85rem; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; margin: 20px 0 15px; padding-bottom: 5px; }

    .form-label { font-size: 0.8rem; font-weight: 700; color: #64748b; margin-bottom: 5px; display: block; }
    .form-control { border-radius: 12px; padding: 10px 15px; border: 1.5px solid #e2e8f0; background: #f8fafc; margin-bottom: 15px; }

    /* Eye Button Fix */
    .pass-group { position: relative; }
    .eye-btn { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #94a3b8; z-index: 10; }

    .submit-btn { background: var(--f-green); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: 700; width: 100%; margin-top: 20px; transition: 0.3s; }
    .submit-btn:disabled { background: #94a3b8; }
</style>

<div class="auth-wrapper">
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

    <div class="auth-card">
        <h2 class="text-center fw-bold">Farmer Registration</h2>
        <form method="post" id="farmerForm" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 border-end pe-md-4">
                    <div class="section-title">Personal Information</div>

                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" name="name" required>

                    <label class="form-label">Email Address</label>
                    <div class="input-group mb-3 gap-2">
                        <input type="email" class="form-control" name="email" id="emailInput">
                        <button type="button" class="btn btn-dark rounded-3" onclick="sendOTP()">Send OTP</button>
                    </div>

                    <div id="otpBox" style="display:none;">
                        <label class="form-label text-success">Enter OTP</label>
                        <input type="text" class="form-control border-success" id="otpInput">
                    </div>

                    <label class="form-label">Full Address</label>
                    <input type="text" class="form-control" name="address" required>

                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" name="city" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Pincode</label>
                            <input type="text" class="form-control" name="pincode" maxlength="6" required>
                        </div>
                    </div>

                    <label class="form-label">Gender</label>
                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check"><input class="form-check-input" type="radio" name="gender" value="Male" id="m" required><label class="form-check-label small" for="m">Male</label></div>
                        <div class="form-check"><input class="form-check-input" type="radio" name="gender" value="Female" id="f"><label class="form-check-label small" for="f">Female</label></div>
                    </div>

                    <label class="form-label">Mobile Number</label>
                    <input type="text" class="form-control" name="contact" maxlength="10" required>
                </div>

                <div class="col-md-6 ps-md-4">
                    <div class="section-title">7/12 Verification</div>

                    <label class="form-label">Gat / Survey Number</label>
                    <input type="text" class="form-control" name="farmer_id_number" id="surveyNo" placeholder="Ex: 335/5/3" required>

                    <label class="form-label">Upload Proof (JPG, PDF)</label>
                    <input type="file" class="form-control" id="docFile" name="farmer_document" required>
                    <small id="ocrStatus" class="fw-bold d-block mb-3"></small>

                    <div class="section-title">Bank Details</div>
                    <label class="form-label">Bank Account Number</label>
                    <input type="text" class="form-control" name="bank_account_number" required>

                    <label class="form-label">IFSC Code</label>
                    <input type="text" class="form-control" name="ifsc_code" id="ifscInput" placeholder="Ex: SBIN0012345" required>
                    <div class="section-title">Security</div>

                    <div class="pass-group">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="pass" required>
                        <i class="fas fa-eye eye-btn" onclick="togglePass('pass')"></i>
                    </div>

                    <div class="pass-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPass" required>
                        <i class="fas fa-eye eye-btn" onclick="togglePass('confirmPass')"></i>
                    </div>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="regBtn">Complete Registration</button>
        </form>
    </div>
</div>

<script>
    // 1. Password Visibility Toggle
    function togglePass(id) {
        const input = document.getElementById(id);
        const icon = event.currentTarget;
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // 2. Validations & Form Submit
    document.getElementById('farmerForm').onsubmit = function(e) {
        let isValid = true;

        // Password Match Validation
        const pass = document.getElementById('pass').value;
        const confirm = document.getElementById('confirmPass').value;
        const passError = document.getElementById('passError');

        if (pass !== confirm) {
            passError.style.display = 'block';
            document.getElementById('confirmPass').classList.add('is-invalid');
            isValid = false;
        } else {
            passError.style.display = 'none';
            document.getElementById('confirmPass').classList.remove('is-invalid');
        }

        // Mobile Validation
        const contact = document.getElementById('contact').value;
        if (!/^\d{10}$/.test(contact)) {
            alert("Please enter a valid 10-digit mobile number.");
            isValid = false;
        }

        // Pincode Validation
        const pincode = document.getElementById('pincode').value;
        if (!/^\d{6}$/.test(pincode)) {
            alert("Please enter a valid 6-digit pincode.");
            isValid = false;
        }

        // IFSC Validation
        const ifsc = document.getElementById('ifscInput').value;
        const ifscRegex = /^[A-Z]{4}0[A-Z0-9]{6}$/;
        if (!ifscRegex.test(ifsc.toUpperCase())) {
            alert("Please enter a valid IFSC code (e.g., SBIN0012345).");
            isValid = false;
        }

        if (!isValid) e.preventDefault();
        return isValid;
    };

    // 3. OTP Function
    function sendOTP() {
        const email = document.getElementById("emailInput").value;
        if (!email || !email.includes('@')) {
            alert("Please enter a valid email address!");
            return;
        }

        fetch("{% url 'send_email_otp' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: "email=" + encodeURIComponent(email)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                alert("OTP sent successfully!");
                document.getElementById("otpBox").style.display = "block";
            } else {
                alert(data.message);
            }
        })
        .catch(() => alert("Server error while sending OTP."));
    }




    // 3. Simple Document Verification
document.getElementById('docFile').onchange = async function() {
    // 1. User ne taklela survey number ghyaycha
    const surveyInput = document.getElementById('surveyNo').value.trim();
    const status = document.getElementById('ocrStatus');
    const file = this.files[0];

    if(!surveyInput) {
        alert("Please Fill Survey Number First!");
        this.value = "";
        return;
    }

    status.innerText = "⏳ Processing Document (JPG, PNG, PDF, WEBP)...";
    status.className = "text-warning fw-bold";

    try {
        let sourceForOCR = file;

        // PDF Support (Ensure pdfjsLib is loaded)
        if (file.type === "application/pdf") {
            const pdfData = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data: pdfData}).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({scale: 2.0}); // Resolution vadhvli mhanje clarity yete
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({canvasContext: context, viewport: viewport}).promise;
            sourceForOCR = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
        }

        const worker = await Tesseract.createWorker('eng');
        const { data: { text } } = await worker.recognize(sourceForOCR);
        await worker.terminate();

        // 🔍 CLEANING LOGIC: White space ani special characters kadhun taka
        const cleanOCRText = text.replace(/[\s\n\r/.-]/g, '').toLowerCase();
        const cleanUserInput = surveyInput.replace(/[\s\n\r/.-]/g, '').toLowerCase();

        console.log("OCR Text Found:", cleanOCRText); // Debugging sathi terminal madhe check kara

        if(cleanOCRText.includes(cleanUserInput)) {
            status.innerText = "✅ Match Found! Document Verified.";
            status.className = "text-success fw-bold";
        } else {
            // Jar match nahi jhala, tar partial check kara
            status.innerText = "❌ Match Not Found. Please upload a clearer image.";
            status.className = "text-danger fw-bold";
        }

    } catch(e) {
        console.error("OCR Error:", e);
        status.innerText = "❌ Error scanning file. Try a JPG/PNG.";
        status.className = "text-danger fw-bold";
    }
};

</script>
{% endblock %}
