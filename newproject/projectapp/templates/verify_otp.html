{% extends "master.html" %}
{% block title %}Verify OTP - AgriLink{% endblock %}

{% block body %}
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="window.history.back()">⬅ Back</button>
</div>

<style>
/* --- Layout & Navbar Offset --- */
.back-btn-wrapper {
    margin-top: 100px;
    margin-bottom: 20px;
    margin-left: 30px;
}

.back-btn {
    border: none;
    padding: 10px 24px;
    border-radius: 50px;
    background: white;
    color: #198754;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.back-btn:hover {
    background: #198754;
    color: white;
    transform: translateX(-5px);
}

/* --- OTP Card Styling --- */
.otp-container {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.otp-card {
    max-width: 450px;
    width: 100%;
    background: #ffffff;
    padding: 50px 40px;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    text-align: center;
    border: 1px solid #f0f0f0;
}

.otp-icon {
    font-size: 3rem;
    margin-bottom: 15px;
    display: block;
}

.otp-card h2 {
    font-weight: 700;
    color: #333;
    margin-bottom: 10px;
}

.otp-card p {
    color: #777;
    font-size: 0.95rem;
    margin-bottom: 30px;
}

/* --- Clean Single Input Styling --- */
.otp-input-modern {
    background-color: #f9fbf9;
    border: 2px solid #e0e0e0;
    border-radius: 15px;
    padding: 15px;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 12px; /* Digits ke beech gap dikhega */
    text-align: center;
    color: #198754;
    transition: 0.3s;
    margin-bottom: 25px;
}

.otp-input-modern:focus {
    background-color: #fff;
    border-color: #198754;
    box-shadow: 0 0 15px rgba(25, 135, 84, 0.15);
    outline: none;
}

/* --- Verify Button --- */
.btn-verify {
    background: linear-gradient(135deg, #198754, #0f6c3e);
    border: none;
    padding: 15px;
    border-radius: 15px;
    font-weight: 600;
    font-size: 1.1rem;
    color: white;
    width: 100%;
    box-shadow: 0 10px 20px rgba(25, 135, 84, 0.2);
    transition: 0.3s;
}

.btn-verify:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(25, 135, 84, 0.35);
}

.resend-link {
    color: #198754;
    text-decoration: none;
    font-weight: 600;
}

.resend-link:hover {
    text-decoration: underline;
}
</style>

<div class="otp-container">
    <div class="otp-card">
        <span class="otp-icon">🔒</span>
        <h2>Verify Identity</h2>
        <p>Please enter the 6-digit code we sent to your email address.</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <input type="text"
                       name="otp"
                       class="form-control otp-input-modern"
                       placeholder="000000"
                       maxlength="6"
                       pattern="\d{6}"
                       inputmode="numeric"
                       required>
            </div>

            <button type="submit" class="btn btn-verify">Verify Now</button>
        </form>

        <div class="mt-4 pt-2">
            <span class="text-muted small">Didn't get the code?</span>
            <a href="#" class="resend-link small ms-1">Resend Code</a>
        </div>
    </div>
</div>

{% endblock %}
