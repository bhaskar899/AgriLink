{% extends 'master.html' %}
{% block title %}Add Product{% endblock %}
{% block body %}
<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="max-width:750px; width:100%; border-radius:15px;">

    <h2 class="text-center mb-4">Add Product</h2>

    <form method="post" enctype="multipart/form-data" action="" id="productForm" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text" class="form-control" name="product" required>
        <div class="invalid-feedback">Product Name is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" name="description" rows="3" required></textarea>
        <div class="invalid-feedback">Description is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" class="form-control" name="price" min="0.01" step="0.01" required>
        <div class="invalid-feedback">Price must be greater than 0.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity (kg)</label>
        <input type="number" class="form-control" name="quantity" min="0.1" step="0.1" required>
        <div class="invalid-feedback">Quantity must be greater than 0.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Location (Auto Fill)</label>
        <input type="text" class="form-control" id="locationInput" name="location" placeholder="Will fill after photo" required>
        <div class="invalid-feedback">Address is required.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Live Product Photo</label>
        <input type="file" class="d-none" name="image" id="imageInput" accept="image/*" capture="camera" required>
        <div class="invalid-feedback" id="imageError">Image is required.</div>
        <button type="button" class="btn btn-secondary w-100" id="captureBtn">Take Photo</button>
        <img id="imagePreview" style="display:none;width:100%;margin-top:10px;border-radius:8px;">
      </div>

      <input type="hidden" id="latitudeInput" name="latitude">
      <input type="hidden" id="longitudeInput" name="longitude">

      <button type="submit" class="btn btn-success w-100">Add Product</button>
    </form>

  </div>
</div>

<script>
// Elements
const form = document.getElementById("productForm");
const captureBtn = document.getElementById("captureBtn");
const fileInput = document.getElementById("imageInput");
const imagePreview = document.getElementById("imagePreview");
const imageError = document.getElementById("imageError");
const locationInput = document.getElementById("locationInput");
const latitudeInput = document.getElementById("latitudeInput");
const longitudeInput = document.getElementById("longitudeInput");

// Open camera
captureBtn.addEventListener("click", () => {
    fileInput.click();
});

// Show image preview and mark as valid
fileInput.addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) {
        imageError.style.display = "block";
        return;
    }

    imageError.style.display = "none";
    const reader = new FileReader();
    reader.onload = ev => {
        imagePreview.src = ev.target.result;
        imagePreview.style.display = "block";
    }
    reader.readAsDataURL(file);

    // Get location after photo
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async pos => {
            latitudeInput.value = pos.coords.latitude;
            longitudeInput.value = pos.coords.longitude;

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                const data = await res.json();
                locationInput.value = data.display_name || "";
            } catch {
                locationInput.value = "";
            }
        });
    }
});

// Simple validation on submit
form.addEventListener("submit", e => {
    let valid = true;

    // Check image
    if (!fileInput.files.length) {
        imageError.style.display = "block";
        valid = false;
    } else {
        imageError.style.display = "none";
    }

    // Check address
    if (locationInput.value.trim() === "") {
        locationInput.classList.add("is-invalid");
        valid = false;
    } else {
        locationInput.classList.remove("is-invalid");
    }

    // Other inputs use default HTML5 required validation
    if (!form.checkValidity()) {
        valid = false;
    }

    if (!valid) e.preventDefault();
});
</script>
{% endblock %}
