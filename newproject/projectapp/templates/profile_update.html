{% extends "master.html" %}
{% block title %}Update Profile{% endblock %}

{% block body %}

<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width:550px; border-radius:20px;">
    <h3 class="text-center mb-4">Update Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label class="fw-bold">Name</label>
      <input type="text" name="name" class="form-control mb-3 rounded-3" value="{{ user.name }}" required>

      <label class="fw-bold">Email</label>
      <input type="email" name="email" class="form-control mb-3 rounded-3" value="{{ user.email }}" required>

      <label class="fw-bold">Contact</label>
      <input type="text" name="contact" class="form-control mb-3 rounded-3" value="{{ user.contact }}">

      <label class="fw-bold">Address</label>
      <textarea name="address" class="form-control mb-3 rounded-3" rows="3">{{ user.address }}</textarea>

      <label class="fw-bold">Profile Image</label>
      <input type="file" name="profile_image" class="form-control mb-4 rounded-3">

      <button class="btn btn-success w-100 py-2 rounded-3">Save Changes</button>
    </form>
  </div>
</div>
{% endblock %}
