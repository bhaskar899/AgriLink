{% extends "master.html" %}
{% block title %}Update Profile{% endblock %}

{% block body %}

<!-- BACK BUTTON -->
<div class="back-btn-wrapper">
    <button class="back-btn" onclick="goBack()">⬅ Back</button>
</div>

<style>
.back-btn-wrapper{
    margin-top: 89px; /* adjust this according to your navbar height */
    margin-bottom: 15px;
    margin-left:20px;
}
.back-btn{
    border: none;
    padding: 12px 26px;
    border-radius: 35px;
    background: linear-gradient(135deg,#198754,#2ecc71);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    transition: .3s;
}
.back-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 15px 35px rgba(0,0,0,.35);
}
.back-btn:active{
    transform: scale(.95);
}
</style>

<script>
function goBack(){
    window.history.back();
}
</script>
<div class="container mt-5">
  <div class="card p-4 mx-auto" style="max-width:550px; border-radius:20px;">
    <h3 class="text-center mb-4">Update Profile</h3>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <label class="fw-bold">Name</label>
      <input type="text" name="name" class="form-control mb-3 rounded-3" value="{{ user.name }}" required>

      <label class="fw-bold">Email</label>
      <input type="email" name="email" class="form-control mb-3 rounded-3" value="{{ user.email }}" required>

      <label class="fw-bold">Contact</label>
      <input type="text" name="contact" class="form-control mb-3 rounded-3" value="{{ user.contact }}">

      <label class="fw-bold">Address</label>
      <textarea name="address" class="form-control mb-3 rounded-3" rows="3">{{ user.address }}</textarea>

      <label class="fw-bold">Profile Image</label>
      <input type="file" name="profile_image" class="form-control mb-4 rounded-3">

      <!-- 🏦 Bank Details (Only Farmer will see & update) -->
      {% if request.session.user_type == "farmer" %}
      <hr>
      <h5 class="fw-bold mt-3">💳 Bank Details for Payout</h5>

      <label class="fw-bold">Bank Name</label>
      <input type="text" name="bank_name" class="form-control mb-3 rounded-3" value="{{ user.bank_name }}">

      <label class="fw-bold">Account Holder Name</label>
      <input type="text" name="account_holder_name" class="form-control mb-3 rounded-3" value="{{ user.account_holder_name }}">

      <label class="fw-bold">Account Number</label>
      <input type="text" name="account_number" class="form-control mb-3 rounded-3" value="{{ user.account_number }}">

     <label class="fw-bold">IFSC Code</label>
<input type="text" id="ifsc_code" name="ifsc_code" class="form-control mb-3 rounded-3" onblur="fetchBankDetails()" required>

      <label class="fw-bold">UPI ID</label>
      <input type="text" name="upi_id" class="form-control mb-4 rounded-3" value="{{ user.upi_id }}">
      {% endif %}

      <button class="btn btn-success w-100 py-2 rounded-3">Save Changes</button>
    </form>
  </div>
</div>

<script>
function fetchBankDetails() {
    const ifsc = document.getElementById("ifsc_code").value.trim();
    if (ifsc.length < 11) return;

    fetch(`https://ifsc.razorpay.com/${ifsc}`)
        .then(res => res.json())
        .then(data => {
            if (data && data.BANK) {
                document.getElementById("bank_name").value = data.BANK;
                document.getElementById("branch_name").value = data.BRANCH;
                document.getElementById("bank_address").value = data.ADDRESS;
            } else {
                alert("Invalid IFSC Code");
            }
        })
        .catch(() => alert("Unable to fetch bank details"));
}
</script>

{% endblock %}
