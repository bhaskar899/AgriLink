
{% extends 'master.html' %}
{% load static %}
{% block title %}Platform Training - AgriLink{% endblock %}
{% block body %}

<style>
.training-wrapper {
    min-height: 100vh;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    padding: 100px 20px 50px;
}

.training-card {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    text-align: center;
}

.training-icon {
    font-size: 5rem;
    margin-bottom: 20px;
}

.training-title {
    font-size: 2rem;
    font-weight: 700;
    color: #198754;
    margin-bottom: 15px;
}

.training-desc {
    font-size: 1.1rem;
    color: #555;
    line-height: 1.7;
    margin-bottom: 30px;
}

.training-progress {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 30px;
}

.progress-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ddd;
    transition: all 0.3s ease;
}

.progress-dot.active {
    background: #198754;
    transform: scale(1.3);
}

.btn-group {
    display: flex;
    gap: 15px;
    justify-content: center;
}

.btn-training {
    padding: 12px 30px;
    border-radius: 10px;
    font-weight: 600;
    transition: all 0.3s ease;
    border: none;
}

.btn-training-back {
    background: #f0f0f0;
    color: #666;
}

.btn-training-back:hover:not(:disabled) {
    background: #e0e0e0;
}

.btn-training-next {
    background: linear-gradient(135deg, #198754, #0f6c3e);
    color: white;
}

.btn-training-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(25,135,84,0.4);
}

.btn-training:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}
</style>

<button class="back-btn" onclick="window.history.back()"
        style="position: absolute; top: 20px; left: 20px; z-index: 10; background: linear-gradient(135deg, #198754, #0f6c3e); border: none; color: white; padding: 10px 20px; border-radius: 25px; font-weight: 600;">
    ⬅ Back
</button>

<div class="training-wrapper">
    <div class="training-card">
        <div class="training-icon" id="stepIcon">👋</div>
        <h2 class="training-title" id="stepTitle">Welcome to AgriLink</h2>
        <p class="training-desc" id="stepDesc">
            This quick tour will help you understand the platform.
        </p>

        <!-- Progress Dots -->
        <div class="training-progress" id="progressDots"></div>

        <div class="btn-group">
            <button class="btn btn-training btn-training-back" id="backBtn" onclick="prevStep()" disabled>
                Previous
            </button>
            <button class="btn btn-training btn-training-next" id="nextBtn" onclick="nextStep()">
                Next
            </button>
        </div>
    </div>
</div>

<script>
const steps = [
    { icon: "👋", title: "Welcome to AgriLink", desc: "This quick tour will help you understand how to use the platform effectively." },
    { icon: "📊", title: "Dashboard Overview", desc: "View your products, orders, and earnings all in one place." },
    { icon: "➕", title: "Add Products", desc: "Upload product details, images, quantities and set your own prices." },
    { icon: "🔍", title: "Browse & Search", desc: "Retailers can browse all products with advanced search and filters." },
    { icon: "🛒", title: "Place Orders", desc: "Retailers can order products and pay securely through Razorpay." },
    { icon: "🚚", title: "Live Tracking", desc: "Track deliveries in real-time from farm to store." },
    { icon: "💬", title: "Direct Chat", desc: "Communicate directly with buyers or sellers for any queries." },
    { icon: "🔔", title: "Notifications", desc: "Get instant updates on orders, payments and delivery status." },
    { icon: "🎉", title: "You're All Set!", desc: "You're now ready to use AgriLink. Let's get started!" }
];

let currentStep = 0;

function updateUI() {
    document.getElementById('stepIcon').textContent = steps[currentStep].icon;
    document.getElementById('stepTitle').textContent = steps[currentStep].title;
    document.getElementById('stepDesc').textContent = steps[currentStep].desc;

    document.getElementById('backBtn').disabled = currentStep === 0;
    document.getElementById('nextBtn').textContent = currentStep === steps.length - 1 ? 'Finish Training' : 'Next';

    // Update progress dots
    const dotsContainer = document.getElementById('progressDots');
    dotsContainer.innerHTML = '';
    steps.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot' + (index === currentStep ? ' active' : '');
        dotsContainer.appendChild(dot);
    });
}

function nextStep() {
    if (currentStep < steps.length - 1) {
        currentStep++;
        updateUI();
    } else {
        window.location.href = "/training_complete/";
    }
}

function prevStep() {
    if (currentStep > 0) {
        currentStep--;
        updateUI();
    }
}

updateUI();
</script>

{% endblock %}
